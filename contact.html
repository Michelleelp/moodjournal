<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Page title, search description, and browser theme color. -->
  <title>MoodJournal | Contact</title>
  <meta name="description" content="Get in touch with the MoodJournal team with questions, ideas, or kind thoughts.">
  <meta name="theme-color" content="#7b5ea7">
  <!-- Favicon links for browser tabs and Apple devices. -->
  <link rel="icon" href="assets/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32x32.png">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="navbar.js" defer></script>
  <script type="module" src="contact.js"></script>
  <script src="effects.js" defer></script>
</head>
<body>
  <!-- Shared navigation and account controls are injected on every page. -->
  <header id="navbar" class="site-header"></header>

  <!-- Contact form sends messages to Firestore and swaps to a confirmation after success. -->
  <main class="page-width contact-page">
    <section class="contact-card surface-card">
      <div class="contact-decoration" aria-hidden="true">💌</div>
      <div class="section-eyebrow">We’re here to listen</div>
      <h1>Say hello</h1>
      <p class="muted-copy">Questions, ideas, or just a kind thought? We’d love to hear from you.</p>
      <form class="contact-form" id="contact-form" novalidate>
        <label for="contact-name">Name</label>
        <input id="contact-name" name="name" type="text" placeholder="Your name" autocomplete="name" maxlength="100" aria-describedby="contact-name-error" required>
        <p class="field-error" id="contact-name-error" role="alert" hidden></p>
        <label for="contact-email">Email</label>
        <input id="contact-email" name="email" type="email" placeholder="you@example.com" autocomplete="email" maxlength="200" aria-describedby="contact-email-error" required>
        <p class="field-error" id="contact-email-error" role="alert" hidden></p>
        <label for="contact-message">Message</label>
        <textarea id="contact-message" name="message" rows="5" maxlength="2000" placeholder="Write us a little note..." aria-describedby="contact-message-counter contact-message-error" required></textarea>
        <div class="contact-message-meta">
          <span class="character-count" id="contact-message-counter" aria-live="polite">0 / 2000 characters</span>
        </div>
        <p class="field-error" id="contact-message-error" role="alert" hidden></p>
        <p class="form-message contact-status" id="contact-status" role="status" aria-live="polite" hidden></p>
        <button class="button button-primary button-full" id="contact-submit" type="submit"><span class="contact-submit-label">Send</span> <span aria-hidden="true">💌</span></button>
      </form>
      <div class="thank-you-panel" id="thank-you" role="status" aria-live="polite" hidden>
        <div class="thank-you-message-wrap">
          <p class="thank-you-message">Thank you for your message 💜 I’ll read it soon!</p>
          <!-- Decorative sparkles twinkle around the confirmation after a successful send. -->
          <div class="thank-you-sparkles" aria-hidden="true">
            <span>✨</span><span>⭐</span><span>💜</span><span>🌟</span>
          </div>
        </div>
        <button class="button button-outline" id="send-another-message" type="button">Send another message</button>
      </div>
    </section>
  </main>
  <!-- Shared footer attribution shown on every page. -->
  <footer class="site-footer">Made with 💜 by @Michelle Lozano and Codex</footer>
</body>
</html>
